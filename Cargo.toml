[package]
name = "vpn-tray"
version = "3.0.0"
edition = "2021"
rust-version = "1.85"
description = "One system tray icon for Tailscale, Twingate, NetBird and WireGuard - one VPN at a time"
license = "MIT"
publish = false

[dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
regex = "1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
