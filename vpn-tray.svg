      Poświata z półprzezroczystych obrysów, bo renderer SVG w Qt/KDE nie obsługuje filtrów. -->
 <defs>
  <radialGradient id="bgGlow" cx="0.5" cy="0.55" r="0.7">
   <stop offset="0" stop-color="#3a1747"/>
   <stop offset="0.55" stop-color="#150d24"/>
   <stop offset="1" stop-color="#07070d"/>
  </radialGradient>
  <linearGradient id="vpnBlue" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#c9b4ff"/>
   <stop offset="1" stop-color="#5b5bd6"/>
  </linearGradient>
 </defs>
 <rect x="2" y="2" width="124" height="124" rx="24" fill="url(#bgGlow)"/>
 <g transform="translate(64 64) scale(4.1) translate(-12 -12)" stroke-linejoin="round">
  <path d="M12 1.6 L20.4 4.7 V11 C20.4 16.4 16.9 20.6 12 22.4 C7.1 20.6 3.6 16.4 3.6 11 V4.7 Z" fill="none" stroke="#b86bff" stroke-opacity="0.18" stroke-width="3.4"/>
