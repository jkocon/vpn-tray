  <path d="M12 1.6 L20.4 4.7 V11 C20.4 16.4 16.9 20.6 12 22.4 C7.1 20.6 3.6 16.4 3.6 11 V4.7 Z" fill="url(#vpnBlue)" stroke="#e3e9ff" stroke-width="0.35"/>
  <path d="M8.2 14.6 L12 7.6 L15.8 14.6 Z" fill="none" stroke="#141a33" stroke-width="0.9"/>
  <circle cx="12" cy="7.6" r="1.7" fill="#ffffff" stroke="#141a33" stroke-width="0.6"/>
  <circle cx="8.2" cy="14.6" r="1.7" fill="#141a33"/>
  <circle cx="15.8" cy="14.6" r="1.7" fill="#141a33"/>
